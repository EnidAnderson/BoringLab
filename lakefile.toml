name = "BoringLab"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BoringLab"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "BoringMath"
path = "../BoringMath"

[[lean_lib]]
name = "BoringLab"
